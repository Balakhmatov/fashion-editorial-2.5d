<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2.5D Fashion Editorial • Face + Tilt Interactive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-depth: 0.015;
      --model-depth: 0.04;
      --text-depth: 0.09;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1410;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: grab;
    }
    body:active { cursor: grabbing; }

    .scene {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .layer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      will-change: transform;
      transform-style: preserve-3d;
    }

    /* BACKGROUND */
    .layer-bg { z-index: 1; }
    .bg-image {
      position: absolute; top: -10%; left: -10%;
      width: 120%; height: 120%;
      background-image: url('https://images.unsplash.com/photo-1744000311635-0280df5cc00e?w=2400&q=85');
      background-size: cover;
      background-position: center 40%;
      filter: saturate(1.05) contrast(1.05) brightness(0.92);
    }
    .bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(40,25,15,0.35) 0%, rgba(20,12,8,0.15) 40%, rgba(60,35,20,0.25) 100%);
      pointer-events: none;
    }
    .bg-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 30%, rgba(10,6,4,0.55) 100%);
      pointer-events: none;
    }

    /* MODEL */
    .layer-model {
      z-index: 2;
      display: flex; align-items: flex-end; justify-content: center;
      pointer-events: none;
    }
    .model-wrapper {
      position: relative;
      height: 92%; max-height: 920px;
      display: flex; align-items: flex-end; justify-content: center;
      filter: drop-shadow(0 25px 40px rgba(0,0,0,0.45));
    }
    .model-image {
      height: 100%; width: auto; max-width: 48vw;
      object-fit: contain; object-position: center bottom;
      -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
    }
    .model-glow {
      position: absolute; bottom: 5%; left: 50%;
      transform: translateX(-50%);
      width: 55%; height: 30%;
      background: radial-gradient(ellipse, rgba(255,220,180,0.18) 0%, transparent 70%);
      filter: blur(30px); z-index: -1;
    }

    /* FOREGROUND TEXT */
    .layer-fg { z-index: 10; pointer-events: none; }
    .editorial-text {
      position: absolute;
      color: #f8f0e6;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.25);
      letter-spacing: 0.04em;
    }
    .headline { top: 7%; left: 5%; max-width: 42%; }
    .headline .kicker {
      font-family: 'Montserrat', sans-serif; font-weight: 500;
      font-size: clamp(0.65rem, 1.1vw, 0.85rem);
      letter-spacing: 0.35em; text-transform: uppercase;
      color: #e8d5b5; margin-bottom: 0.6em; opacity: 0.9;
    }
    .headline h1 {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: clamp(2.4rem, 5.5vw, 4.8rem);
      line-height: 0.95; color: #faf6f0; margin-bottom: 0.15em;
    }
    .headline h1 em { font-style: italic; font-weight: 400; color: #e8c9a0; }
    .headline .sub {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(1.1rem, 2vw, 1.55rem);
      letter-spacing: 0.08em; color: #d4c4a8; margin-top: 0.4em;
    }
    .vertical-type {
      top: 18%; right: 4.5%;
      writing-mode: vertical-rl; text-orientation: mixed;
      font-family: 'Montserrat', sans-serif; font-weight: 400;
      font-size: clamp(0.7rem, 1.15vw, 0.9rem);
      letter-spacing: 0.45em; text-transform: uppercase;
      color: #e8d9c0; opacity: 0.85;
    }
    .issue-block {
      bottom: 11%; left: 5%;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.95rem, 1.6vw, 1.25rem);
      color: #e0d0b5; line-height: 1.5;
    }
    .issue-block .vol {
      font-family: 'Montserrat', sans-serif; font-size: 0.7em;
      letter-spacing: 0.25em; text-transform: uppercase;
      opacity: 0.75; margin-bottom: 0.3em;
    }
    .quote-block { bottom: 18%; right: 6%; max-width: 280px; text-align: right; }
    .quote-block p {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-weight: 400; font-size: clamp(1rem, 1.7vw, 1.35rem);
      line-height: 1.45; color: #f0e6d6; opacity: 0.92;
    }
    .quote-block .attr {
      font-family: 'Montserrat', sans-serif; font-size: 0.65rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: #c9b89a; margin-top: 0.8em; opacity: 0.8;
    }
    .deco-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, #e8d5b5, transparent);
      height: 1px; opacity: 0.5;
    }
    .deco-line.top { top: 5.5%; left: 5%; width: 12%; }
    .deco-line.side {
      top: 22%; right: 3.2%; width: 1px; height: 18%;
      background: linear-gradient(180deg, transparent, #e8d5b5, transparent);
    }
    .brand-mark {
      top: 6.5%; right: 5%;
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: clamp(1.1rem, 1.8vw, 1.5rem);
      letter-spacing: 0.15em; color: #f5e9d5; opacity: 0.9;
    }
    .brand-mark span { font-weight: 400; font-style: italic; font-size: 0.75em; opacity: 0.7; }

    .gloss {
      position: absolute; inset: 0; z-index: 20; pointer-events: none;
      background: linear-gradient(125deg, rgba(255,255,255,0.03) 0%, transparent 35%, transparent 65%, rgba(255,255,255,0.02) 100%);
      mix-blend-mode: soft-light;
    }
    .grain {
      position: absolute; inset: 0; z-index: 15; pointer-events: none; opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* UI */
    .hint {
      position: absolute; bottom: 3.5%; left: 50%; transform: translateX(-50%);
      z-index: 30; font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(232,213,181,0.55); pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .hint.hidden { opacity: 0; }

    .status {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 40; display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 20px;
      background: rgba(20,12,8,0.55); backdrop-filter: blur(8px);
      border: 1px solid rgba(232,213,181,0.18);
      font-family: 'Montserrat', sans-serif; font-size: 0.6rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(232,213,181,0.7); pointer-events: none;
      transition: opacity 0.4s;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #888; transition: background 0.3s;
    }
    .status.face .status-dot { background: #7dcea0; box-shadow: 0 0 8px #7dcea0; }
    .status.tilt .status-dot { background: #f0c674; }
    .status.mouse .status-dot { background: #85c1e9; }
    .status.auto .status-dot { background: #aaa; }

    /* Hidden camera */
    #webcam {
      position: absolute; width: 1px; height: 1px;
      opacity: 0; pointer-events: none; overflow: hidden;
    }

    @media (max-width: 768px) {
      .headline { max-width: 70%; top: 6%; left: 4%; }
      .headline h1 { font-size: clamp(2rem, 8vw, 3.2rem); }
      .vertical-type { display: none; }
      .quote-block { bottom: 14%; right: 4%; max-width: 200px; }
      .model-image { max-width: 78vw; }
      .issue-block { bottom: 8%; }
      .brand-mark { top: 5.5%; right: 4%; }
    }
    @media (max-width: 480px) {
      .headline h1 { font-size: 2.1rem; }
      .quote-block { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="layer layer-bg" id="layerBg">
      <div class="bg-image"></div>
      <div class="bg-overlay"></div>
      <div class="bg-vignette"></div>
    </div>

    <div class="layer layer-model" id="layerModel">
      <div class="model-wrapper">
        <div class="model-glow"></div>
        <img class="model-image"
          src="https://images.pexels.com/photos/28838760/pexels-photo-28838760.jpeg?auto=compress&cs=tinysrgb&w=1400"
          alt="Fashion model" draggable="false" />
      </div>
    </div>

    <div class="layer layer-fg" id="layerFg">
      <div class="deco-line top"></div>
      <div class="deco-line side"></div>
      <div class="editorial-text brand-mark">ATELIER <span>№ 24</span></div>
      <div class="editorial-text headline">
        <div class="kicker">Autumn / Winter Editorial</div>
        <h1>Silent<br><em>Opulence</em></h1>
        <div class="sub">The art of quiet luxury</div>
      </div>
      <div class="editorial-text vertical-type">Fashion • Architecture • Desire</div>
      <div class="editorial-text issue-block">
        <div class="vol">Volume XII — Page 48</div>
        Photographed in the golden suite<br>of Hôtel Maison
      </div>
      <div class="editorial-text quote-block">
        <p>“Elegance is the only beauty that never fades.”</p>
        <div class="attr">— Audrey Hepburn</div>
      </div>
    </div>

    <div class="gloss"></div>
    <div class="grain"></div>
    <div class="hint" id="hint">Камера · Наклон · Касание</div>
    <div class="status auto" id="status">
      <div class="status-dot"></div>
      <span id="statusText">Авто</span>
    </div>
  </div>

  <video id="webcam" playsinline muted></video>

  <script type="module">
    const scene = document.getElementById('scene');
    const layerBg = document.getElementById('layerBg');
    const layerModel = document.getElementById('layerModel');
    const layerFg = document.getElementById('layerFg');
    const hint = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const video = document.getElementById('webcam');

    // Depth: text most, model medium, bg least
    const DEPTH = { bg: 14, model: 36, fg: 78 };

    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;
    let autoPhase = 0;
    let mode = 'auto'; // 'face' | 'tilt' | 'mouse' | 'auto'
    let faceActive = false;
    let lastFaceTime = 0;
    let hasInteracted = false;
    let faceLandmarker = null;
    let lastVideoTime = -1;
    let cameraReady = false;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function setMode(m) {
      if (mode === m) return;
      mode = m;
      statusEl.className = 'status ' + m;
      const labels = { face: 'Лицо', tilt: 'Наклон', mouse: 'Мышь', auto: 'Авто' };
      statusText.textContent = labels[m] || m;
    }

    function applyLayers(x, y) {
      layerBg.style.transform = `translate3d(${x * DEPTH.bg}px, ${y * DEPTH.bg}px, 0) scale(1.05)`;
      layerModel.style.transform = `translate3d(${x * DEPTH.model}px, ${y * DEPTH.model}px, 0)`;
      layerFg.style.transform = `translate3d(${x * DEPTH.fg}px, ${y * DEPTH.fg}px, 0)`;
    }

    // ---------- FACE TRACKING (MediaPipe) ----------
    async function initFaceTracking() {
      try {
        const { FaceLandmarker, FilesetResolver } = await import(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'
        );

        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        );

        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        cameraReady = true;
        console.log('Face tracking ready');
      } catch (err) {
        console.warn('Camera / FaceLandmarker unavailable:', err.message);
        cameraReady = false;
      }
    }

    function processFace() {
      if (!faceLandmarker || !cameraReady || video.readyState < 2) return false;

      const now = performance.now();
      if (video.currentTime === lastVideoTime) return faceActive;
      lastVideoTime = video.currentTime;

      const result = faceLandmarker.detectForVideo(video, now);
      if (result.faceLandmarks && result.faceLandmarks.length > 0) {
        const landmarks = result.faceLandmarks[0];
        // Nose tip ≈ landmark 1
        const nose = landmarks[1];
        // Mirror X because selfie camera is mirrored
        const nx = (0.5 - nose.x) * 2.4;
        const ny = (nose.y - 0.45) * 2.2;

        targetX = Math.max(-1, Math.min(1, nx));
        targetY = Math.max(-1, Math.min(1, ny));
        faceActive = true;
        lastFaceTime = now;
        setMode('face');
        hasInteracted = true;
        hint.classList.add('hidden');
        return true;
      }

      if (now - lastFaceTime > 400) {
        faceActive = false;
      }
      return faceActive;
    }

    // ---------- DEVICE ORIENTATION (TILT) ----------
    function handleOrientation(e) {
      if (e.gamma == null || e.beta == null) return;
      if (faceActive) return;

      const nx = Math.max(-1, Math.min(1, e.gamma / 22));
      const ny = Math.max(-1, Math.min(1, (e.beta - 40) / 30));
      targetX = nx * 0.95;
      targetY = ny * 0.85;
      setMode('tilt');
      hasInteracted = true;
      hint.classList.add('hidden');
    }

    if (window.DeviceOrientationEvent) {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const ask = () => {
          DeviceOrientationEvent.requestPermission()
            .then(s => { if (s === 'granted') window.addEventListener('deviceorientation', handleOrientation); })
            .catch(() => {});
          scene.removeEventListener('touchstart', ask);
          scene.removeEventListener('click', ask);
        };
        scene.addEventListener('touchstart', ask, { once: true });
        scene.addEventListener('click', ask, { once: true });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    // ---------- MOUSE / TOUCH ----------
    function onPointer(clientX, clientY) {
      if (faceActive) return;
      const rect = scene.getBoundingClientRect();
      const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
      const ny = ((clientY - rect.top) / rect.height) * 2 - 1;
      targetX = Math.max(-1, Math.min(1, nx));
      targetY = Math.max(-1, Math.min(1, ny));
      setMode('mouse');
      hasInteracted = true;
      hint.classList.add('hidden');
    }

    scene.addEventListener('mousemove', e => onPointer(e.clientX, e.clientY));
    scene.addEventListener('touchmove', e => {
      if (e.touches.length) {
        e.preventDefault();
        onPointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });
    scene.addEventListener('touchstart', e => {
      if (e.touches.length) onPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // ---------- MAIN LOOP ----------
    function tick() {
      const hasFace = processFace();

      if (!hasFace && mode !== 'tilt' && mode !== 'mouse') {
        autoPhase += 0.0055;
        targetX = Math.sin(autoPhase) * 0.45;
        targetY = Math.sin(autoPhase * 0.65 + 1.1) * 0.28;
        setMode('auto');
      }

      currentX = lerp(currentX, targetX, 0.09);
      currentY = lerp(currentY, targetY, 0.09);
      applyLayers(currentX, currentY);

      requestAnimationFrame(tick);
    }

    initFaceTracking();
    tick();

    setTimeout(() => {
      if (!hasInteracted) hint.classList.add('hidden');
    }, 9000);
  </script>
</body>
</html>
